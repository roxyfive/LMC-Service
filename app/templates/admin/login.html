<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Accesso admin | LMC Service</title><meta name="robots" content="noindex">
<link rel="stylesheet" href="/static/css/admin.css"></head>
<body>
<form method="post" class="login">
  <img src="/static/img/logo-480.webp" alt="LMC Service">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label>Utente<input name="username" autocomplete="username" required autofocus></label>
  <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
  {% if err %}<div class="err">{{ err }}</div>{% endif %}
  <button class="btn">Accedi</button>
</form>
</body></html>
