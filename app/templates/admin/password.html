{% extends "admin/base.html" %}{% block body %}
<h1>Cambia password</h1>
<form method="post" class="form" style="grid-template-columns:1fr;max-width:460px">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  {% if msg %}<p class="flash" role="status" style="{{ '' if ok else 'background:#fde8e8;color:#a32626' }}">{{ msg }}</p>{% endif %}
  <label>Password attuale<input name="old" type="password" autocomplete="current-password" required></label>
  <label>Nuova password (almeno 10 caratteri)<input name="new" type="password" autocomplete="new-password" minlength="10" required></label>
  <label>Ripeti la nuova password<input name="new2" type="password" autocomplete="new-password" minlength="10" required></label>
  <button class="btn">Cambia password</button>
  <p class="mut">Consiglio: una frase lunga che solo tu conosci. Non riutilizzare la password di altri siti.</p>
</form>
{% endblock %}
