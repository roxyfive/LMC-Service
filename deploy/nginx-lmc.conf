# /etc/nginx/sites-available/lmc  — sostituisci DOMINIO con il tuo (es. www.lmcservice.it)
# Certbot aggiungerà da solo la parte HTTPS (porta 443) e il reindirizzamento da http a https.

# limiti anti-abuso: webhook e invii dei form
limit_req_zone $binary_remote_addr zone=lmc_hooks:5m rate=30r/m;
limit_req_zone $binary_remote_addr zone=lmc_forms:5m rate=20r/m;

server {
    listen 80;
    listen [::]:80;
    server_name DOMINIO;

    # upload foto/video dall'admin (il sito accetta fino a 200 MB per richiesta)
    client_max_body_size 200M;
    client_body_timeout 120s;

    # compressione
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_vary on;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml application/manifest+json;

    # intestazioni di sicurezza (HSTS si aggiunge dopo che l'HTTPS funziona: vedi guida)
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # file statici serviti direttamente da nginx (veloce) con cache
    location /static/ {
        alias /srv/lmc/app/static/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }
    # video/audio: nginx supporta lo streaming a blocchi (range) in automatico
    location /static/media/ {
        alias /srv/lmc/app/static/media/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # controllo "il sito è su?" (monitoraggio)
    location = /health {
        proxy_pass http://127.0.0.1:8010;
        access_log off;
    }

    location /webhook/ {
        limit_req zone=lmc_hooks burst=20 nodelay;
        include /etc/nginx/lmc-proxy.conf;
    }
    location /api/ {
        limit_req zone=lmc_forms burst=40 nodelay;
        include /etc/nginx/lmc-proxy.conf;
    }
    # tutto il resto (pagine, /media/ con foto e video caricati, /admin)
    location / {
        include /etc/nginx/lmc-proxy.conf;
    }
}
